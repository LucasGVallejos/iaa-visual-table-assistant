[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "iaa-table-assistant"
version = "0.1.0"
description = "Visual table assistant for people with visual impairment, based on object detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "mlflow>=2.8.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "dvc>=3.30.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

gdrive = [
    "dvc-gdrive>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

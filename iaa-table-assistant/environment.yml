name: iaa-table-assistant

channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core data/scientific stack
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - pyyaml>=6.0
  - tqdm>=4.65.0

  # Notebooks
  - jupyter>=1.0.0
  - ipywidgets>=8.0.0

  # PyTorch
  - pytorch>=2.0.0
  - torchvision>=0.15.0

  - pip:
      # Object detection
      - ultralytics>=8.0.0

      # Computer vision
      - opencv-python>=4.8.0
      - Pillow>=10.0.0

      # Experiment tracking
      - mlflow>=2.8.0

      # Dataset/model versioning
      - dvc>=3.0.0
      # - dvc-gdrive>=3.0.0  # Enable if Google Drive is used as DVC remote

      # ONNX export and validation
      - onnx>=1.14.0
      - onnxruntime>=1.16.0
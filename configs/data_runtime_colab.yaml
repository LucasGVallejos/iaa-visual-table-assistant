# Dataset configuration for YOLO training.
#
# The split is materialized as text files of absolute image paths produced
# by ``src/data/preparation/split_dataset.py``. YOLO loads each split by
# reading the corresponding .txt file, so no images are duplicated on disk.

path: /content/iaa-visual-table-assistant

train: /content/iaa-visual-table-assistant/reports/dataset_splits/train.txt
val: /content/iaa-visual-table-assistant/reports/dataset_splits/val.txt
test: /content/iaa-visual-table-assistant/reports/dataset_splits/test.txt

nc: 7

names:
  0: food
  1: cup
  2: bottle
  3: plate
  4: spoon
  5: fork
  6: knife
